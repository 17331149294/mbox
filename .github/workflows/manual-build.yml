name: Manual Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, release will be tagged as v{version}"
        required: true
        type: string

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}${{ matrix.gomips && format('-{0}', matrix.gomips) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            goarm: "7"
          - os: linux
            arch: arm
            goarm: "6"
          - os: linux
            arch: arm
            goarm: "5"
          - os: linux
            arch: "386"
          - os: linux
            arch: riscv64
          - os: linux
            arch: loong64
          - os: linux
            arch: mips
            gomips: softfloat
          - os: linux
            arch: mipsle
            gomips: hardfloat
          - os: linux
            arch: mipsle
            gomips: softfloat
          - os: linux
            arch: mips64
            gomips: softfloat
          - os: linux
            arch: mips64le
            gomips: softfloat
          - os: linux
            arch: s390x
          - os: linux
            arch: ppc64le
          # Windows
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: windows
            arch: "386"
          # macOS
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.3
      - name: Build
        run: |
          mkdir -p dist
          go build --ldflags '-s -w' -o dist/sing-box \
            -tags "with_quic,with_grpc,with_wireguard,with_utls,with_clash_api,with_v2ray_api" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
      - name: Archive
        run: |
          set -euo pipefail
          cd dist
          DIR_NAME="sing-box-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            DIR_NAME="${DIR_NAME}v${{ matrix.goarm }}"
          elif [ -n "${{ matrix.gomips }}" ] && [ "${{ matrix.gomips }}" != "hardfloat" ]; then
            DIR_NAME="${DIR_NAME}-${{ matrix.gomips }}"
          fi
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}/"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp sing-box "${DIR_NAME}/sing-box.exe"
            zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
          else
            cp sing-box "${DIR_NAME}/sing-box"
            tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          fi
          rm -r "${DIR_NAME}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}${{ matrix.gomips && format('-{0}', matrix.gomips) }}
          path: dist

  release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create / Update Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
